options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'
  machineType: 'E2_HIGHCPU_16'
  diskSizeGb: '100'

timeout: 1800s

substitutions:
  _REGION: us-central1
  _JOB_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/job-service:latest
  _INGEST_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/ingest:latest
  _DETECT_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/detect-bootstrap:latest
  _STREAM_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/stream-parser:latest
  _AI_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/ai-classifier:latest
  _LOAD_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/load:latest
  _REPORT_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/report:latest
  _RETRY_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/retry:latest
  _ARCHIVE_ENTRY_IMAGE: us-central1-docker.pkg.dev/data-etl-499916/file-parsing/archive-entry-consumer:latest
  _AI_INLINE_MODE: 'false'
  _MAX_AI_CALLS_PER_JOB: '5'

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'create-env'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "GCP_PROJECT_ID=data-etl-499916" > .env
        echo "DATA_BUCKET=$(gcloud secrets versions access latest --secret=FILE_DATA_BUCKET)" >> .env
        echo "FILE_DATABASE_URL=$(gcloud secrets versions access latest --secret=FILE_DATABASE_URL)" >> .env
        echo "QUEUE_BACKEND=pubsub" >> .env
        echo "FIRESTORE_DATABASE_ID=$(gcloud secrets versions access latest --secret=FILE_FIRESTORE_DATABASE_ID)" >> .env
        echo "TEMPLATE_COLLECTION=file-parsing-templates" >> .env
        echo "BEDROCK_MODEL_ID=$(gcloud secrets versions access latest --secret=FILE_BEDROCK_MODEL_ID)" >> .env
        echo "HEALTH_CHECK_PORT=8080" >> .env
        echo "NODE_ENV=production" >> .env
        echo "LOKI_HOST=$(gcloud secrets versions access latest --secret=FILE_LOKI_HOST)" >> .env
        echo "LOKI_USERNAME=$(gcloud secrets versions access latest --secret=FILE_LOKI_USERNAME)" >> .env
        echo "LOKI_PASSWORD=$(gcloud secrets versions access latest --secret=FILE_LOKI_PASSWORD)" >> .env
        echo "ARCHIVE_ENTRY_QUEUE_URL=$(gcloud secrets versions access latest --secret=FILE_ARCHIVE_ENTRY_QUEUE_URL)" >> .env
        echo "LARGE_FILE_THRESHOLD_BYTES=524288000" >> .env

  - name: 'node:20'
    id: 'lint'
    waitFor: ['create-env']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm install -g pnpm
        pnpm install --frozen-lockfile
        pnpm run lint

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'ensure-pubsub'
    waitFor: ['lint']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        for topic in fpp-ingest fpp-classify fpp-parse fpp-line-dlq fpp-load fpp-report fpp-job-events fpp-archive-entry; do
          gcloud pubsub topics create $topic --project=data-etl-499916 || true
          gcloud pubsub subscriptions create ${topic}-sub \
            --topic=$topic \
            --ack-deadline-seconds=60 \
            --project=data-etl-499916 || true
        done

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-job'
    waitFor: ['lint']
    args:
      - --dockerfile=Dockerfile.job
      - --context=dir:///workspace
      - --destination=$_JOB_IMAGE
      - --cache=true
      - --cache-ttl=24h

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-ingest'
    waitFor: ['lint']
    args:
      - --dockerfile=Dockerfile.ingest
      - --context=dir:///workspace
      - --destination=$_INGEST_IMAGE
      - --cache=true
      - --cache-ttl=24h

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-detect'
    waitFor: ['lint']
    args:
      - --dockerfile=Dockerfile.detect
      - --context=dir:///workspace
      - --destination=$_DETECT_IMAGE
      - --cache=true
      - --cache-ttl=24h

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-stream'
    waitFor: ['lint']
    args:
      - --dockerfile=Dockerfile.stream
      - --context=dir:///workspace
      - --destination=$_STREAM_IMAGE
      - --cache=true
      - --cache-ttl=24h

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-load'
    waitFor: ['lint']
    args:
      - --dockerfile=Dockerfile.load
      - --context=dir:///workspace
      - --destination=$_LOAD_IMAGE
      - --cache=true
      - --cache-ttl=24h

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-report'
    waitFor: ['lint']
    args:
      - --dockerfile=Dockerfile.report
      - --context=dir:///workspace
      - --destination=$_REPORT_IMAGE
      - --cache=true
      - --cache-ttl=24h

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-archive'
    waitFor: ['lint']
    args:
      - --dockerfile=Dockerfile.archive-entry
      - --context=dir:///workspace
      - --destination=$_ARCHIVE_ENTRY_IMAGE
      - --cache=true
      - --cache-ttl=24h

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor:
      - 'build-job'
      - 'build-ingest'
      - 'build-detect'
      - 'build-stream'
      - 'build-load'
      - 'build-report'
      - 'build-archive'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        gcloud run deploy job-service \
          --image $_JOB_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 2Gi \
          --cpu 4 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 1 \
          --no-cpu-throttling \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080 \
          --remove-secrets=DATABASE_URL \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest,CORS_DOMAINS=CORS_DOMAINS:latest,CORS_ENABLED=CORS_ENABLED:latest

        gcloud run deploy ingest \
          --image $_INGEST_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 4Gi \
          --cpu 1 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 1 \
          --no-cpu-throttling \
          --execution-environment gen2 \
          --session-affinity \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080,RAR_TEMP_MOUNT=/mnt/scratch,ARCHIVE_ENTRY_QUEUE_URL=pubsub://projects/data-etl-499916/topics/fpp-archive-entry,LARGE_FILE_THRESHOLD_BYTES=524288000 \
          --remove-secrets=DATABASE_URL \
          --add-volume name=rar-temp,type=cloud-storage,bucket=datalead-osint \
          --add-volume-mount volume=rar-temp,mount-path=/mnt/scratch \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest

        gcloud run deploy detect-bootstrap \
          --image $_DETECT_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 512Mi \
          --cpu 1 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 1 \
          --no-cpu-throttling \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080 \
          --remove-secrets=DATABASE_URL \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest

        gcloud run deploy stream-parser \
          --image $_STREAM_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 4Gi \
          --cpu 4 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 1 \
          --concurrency 1 \
          --no-cpu-throttling \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080,AI_INLINE_MODE=${_AI_INLINE_MODE},MAX_AI_CALLS_PER_JOB=${_MAX_AI_CALLS_PER_JOB} \
          --remove-secrets=DATABASE_URL \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest

        gcloud run deploy load-small \
          --image $_LOAD_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 1Gi \
          --cpu 2 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 0 \
          --no-cpu-throttling \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080,LOAD_QUEUE_URL=fpp-load \
          --remove-secrets=DATABASE_URL \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest

        gcloud run deploy load \
          --image $_LOAD_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 2Gi \
          --cpu 4 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 1 \
          --no-cpu-throttling \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080,LOAD_QUEUE_URL=fpp-load \
          --remove-secrets=DATABASE_URL \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest

        gcloud run deploy load-large \
          --image $_LOAD_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 4Gi \
          --cpu 4 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 0 \
          --no-cpu-throttling \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080,LOAD_QUEUE_URL=fpp-load \
          --remove-secrets=DATABASE_URL \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest

        gcloud run deploy report \
          --image $_REPORT_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 512Mi \
          --cpu 1 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 1 \
          --no-cpu-throttling \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080 \
          --remove-secrets=DATABASE_URL \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest

        gcloud run deploy archive-entry-consumer \
          --image $_ARCHIVE_ENTRY_IMAGE \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --service-account=datalead-osint@data-etl-499916.iam.gserviceaccount.com \
          --add-cloudsql-instances=data-etl-499916:us-central1:datalead-osint \
          --memory 2Gi \
          --cpu 1 \
          --timeout 3600s \
          --max-instances 5 \
          --min-instances 1 \
          --no-cpu-throttling \
          --execution-environment gen2 \
          --session-affinity \
          --set-env-vars QUEUE_BACKEND=pubsub,GCP_PROJECT_ID=data-etl-499916,TEMPLATE_COLLECTION=file-parsing-templates,HEALTH_CHECK_PORT=8080,RAR_TEMP_MOUNT=/mnt/scratch,ARCHIVE_ENTRY_QUEUE_URL=pubsub://projects/data-etl-499916/topics/fpp-archive-entry,LARGE_FILE_THRESHOLD_BYTES=524288000 \
          --remove-secrets=DATABASE_URL \
          --add-volume name=rar-temp,type=cloud-storage,bucket=datalead-osint \
          --add-volume-mount volume=rar-temp,mount-path=/mnt/scratch \
          --update-secrets=FILE_DATABASE_URL=FILE_DATABASE_URL:latest,DATA_BUCKET=FILE_DATA_BUCKET:latest,FIRESTORE_DATABASE_ID=FILE_FIRESTORE_DATABASE_ID:latest,BEDROCK_MODEL_ID=FILE_BEDROCK_MODEL_ID:latest,LOKI_HOST=FILE_LOKI_HOST:latest,LOKI_USERNAME=FILE_LOKI_USERNAME:latest,LOKI_PASSWORD=FILE_LOKI_PASSWORD:latest
